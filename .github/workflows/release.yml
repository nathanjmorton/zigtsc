name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-macos
          - x86_64-macos
          - x86_64-linux-gnu
          - aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/zigtsc-${{ matrix.target }}.tar.gz -C zig-out/bin zigtsc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zigtsc-${{ matrix.target }}
          path: dist/zigtsc-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*.tar.gz

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256 hashes
        id: shas
        run: |
          echo "aarch64_macos=$(sha256sum artifacts/zigtsc-aarch64-macos.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "x86_64_macos=$(sha256sum artifacts/zigtsc-x86_64-macos.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "aarch64_linux=$(sha256sum artifacts/zigtsc-aarch64-linux-gnu.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "x86_64_linux=$(sha256sum artifacts/zigtsc-x86_64-linux-gnu.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA_AARCH64_MACOS: ${{ steps.shas.outputs.aarch64_macos }}
          SHA_X86_64_MACOS: ${{ steps.shas.outputs.x86_64_macos }}
          SHA_AARCH64_LINUX: ${{ steps.shas.outputs.aarch64_linux }}
          SHA_X86_64_LINUX: ${{ steps.shas.outputs.x86_64_linux }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/nathanjmorton/homebrew-zigtsc.git" tap
          cd tap

          # Update version
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Formula/zigtsc.rb

          # Update sha256 hashes in order: macos-arm, macos-intel, linux-arm, linux-intel
          awk -v s1="$SHA_AARCH64_MACOS" \
              -v s2="$SHA_X86_64_MACOS" \
              -v s3="$SHA_AARCH64_LINUX" \
              -v s4="$SHA_X86_64_LINUX" '
            /sha256/ { count++
              if (count==1) sub(/sha256 ".*"/, "sha256 \""s1"\"")
              if (count==2) sub(/sha256 ".*"/, "sha256 \""s2"\"")
              if (count==3) sub(/sha256 ".*"/, "sha256 \""s3"\"")
              if (count==4) sub(/sha256 ".*"/, "sha256 \""s4"\"")
            }
            { print }
          ' Formula/zigtsc.rb > Formula/zigtsc.rb.tmp
          mv Formula/zigtsc.rb.tmp Formula/zigtsc.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/zigtsc.rb
          git commit -m "zigtsc ${VERSION}"
          git push
